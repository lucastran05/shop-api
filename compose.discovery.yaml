name: bloomora

# Portable local stack for sibling clones:
#   workspace/shop-api
#   workspace/shop-web
# Run from shop-api with: docker compose -f compose.discovery.yaml up -d --build --wait
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in shop-api/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${BLOOMORA_MAILPIT_PORT:-18025}:8025"

  api:
    build:
      context: .
      target: production
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /app/private-uploads && chown node:node /app/private-uploads && exec su node -s /bin/sh -c 'npm start'"]
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in shop-api/.env}
      DB_NAME: shop_db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in shop-api/.env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in shop-api/.env}
      CLIENT_URL: http://localhost:${BLOOMORA_WEB_PORT:-18080}
      PUBLIC_API_URL: ""
      UPLOAD_STORAGE: local
      UPLOAD_DIR: /app/uploads
      PRIVATE_UPLOAD_DIR: /app/private-uploads
      PLANTNET_API_KEY: ${PLANTNET_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DISCOVERY_GEMINI_MODEL: ${DISCOVERY_GEMINI_MODEL:-gemini-3.5-flash-lite}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DISCOVERY_GROQ_MODEL: ${DISCOVERY_GROQ_MODEL:-openai/gpt-oss-20b}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      DISCOVERY_COHERE_MODEL: ${DISCOVERY_COHERE_MODEL:-rerank-v5.0-fast}
      DISCOVERY_EVALUATE_COHERE: ${DISCOVERY_EVALUATE_COHERE:-0}
      WIKIPEDIA_USER_AGENT: ${WIKIPEDIA_USER_AGENT:-}
      PASSWORD_RESET_URL: http://localhost:${BLOOMORA_WEB_PORT:-18080}/reset-password
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    volumes:
      - uploads:/app/uploads
      - private_uploads:/app/private-uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      default:
        aliases:
          - shop_api
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  web:
    build:
      context: ../shop-web
    ports:
      - "${BLOOMORA_WEB_PORT:-18080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  private_uploads:
